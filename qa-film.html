<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koi Flow full-page motion capture</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}button{position:fixed;right:18px;top:115px;z-index:99;padding:12px;color:#722;background:#f3eedc;border:0;border-radius:4px}button[hidden]{display:none}</style></head><body><iframe id="film" src="dist/index.html" title="Complete Koi Flow experience"></iframe><button id="start">Play full-page journey</button><script>
const frame=document.querySelector('iframe'),button=document.querySelector('button');
button.onclick=()=>{button.hidden=true;const w=frame.contentWindow,j=w.document.querySelector('#journey'),range=j.offsetHeight-w.innerHeight;const stops=[[0,0],[3,0],[6,.12],[8,.12],[11,.30],[14,.43],[17,.43],[20,.70],[23,.70],[26,.865],[29,.865],[33,1],[37,1]];let start=0;function tick(now){if(!start)start=now;const t=(now-start)/1000;let p=1;for(let i=1;i<stops.length;i++){if(t<=stops[i][0]){const [a,pa]=stops[i-1],[b,pb]=stops[i],u=Math.max(0,Math.min(1,(t-a)/(b-a)));p=pa+(pb-pa)*(u*u*(3-2*u));break;}}w.scrollTo({top:range*p,behavior:'instant'});if(t<37)requestAnimationFrame(tick);else button.hidden=false;}requestAnimationFrame(tick);};
</script></body></html>
