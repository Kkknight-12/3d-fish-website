<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koi exact viewport comparison</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style><iframe id="app" src="index.html?profile=1"></iframe><script>const f=document.querySelector('iframe');f.addEventListener('load',()=>{const w=f.contentWindow;requestAnimationFrame(()=>{const stage=w.document.querySelector('#journey');const p=Number(new URLSearchParams(location.search).get('p')||0);w.scrollTo({top:p*(stage.offsetHeight-w.innerHeight),behavior:'instant'});});});</script>
