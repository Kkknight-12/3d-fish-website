<!doctype html><meta charset="utf-8"><title>Koi geometry comparison</title><style>body{margin:0;background:#bb2e2c;color:#fff;font:14px system-ui}header{height:110px;flex-wrap:wrap;padding:12px;box-sizing:border-box;background:#922326;display:flex;align-items:center;gap:12px}button,input{font:inherit}canvas{width:100vw;height:calc(100vh - 110px);display:block}output{margin-left:16px}label{display:flex;gap:5px}</style><header><strong id="label"></strong><button data-p=".54" data-a="0">Overhead</button><button data-p=".58" data-a="0">Shallow</button><button data-p=".66" data-a="270">Half turn</button><button data-p=".911177" data-a="-78.929">User pose</button><button data-p=".72" data-a="270">Approach</button><button data-p=".82" data-a="270">Front</button><button id="play">Play</button><label>Time<input id="time" type="number" value="2.5" step=".5" min="0" max="10" style="width:60px"></label><output id="state"></output></header><canvas id="qa"></canvas><script type="module">
import{turnPitch}from'./pose-3d.js';import{createViewRenderer}from'./view-renderer.js';import{createTurn}from'./spine.js';
const label=document.querySelector('#label');label.textContent=location.port==='5180'?'Transferred source':'Candidate experiment';
const load=src=>new Promise((resolve,reject)=>{let i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
const [original,front]=await Promise.all([load('assets/koi.webp'),load('assets/koi-face-proof-v4-ivory.png')]);
const canvas=document.querySelector('#qa');let p=.54,angle=0,time=2.5,playing=false,last=0;const turn=createTurn(0);
const renderer=createViewRenderer(canvas,original,front,(w,h)=>({fishWidth:Math.min(w*.87,h*1.4),centerX:angle===0?w*.5:w*.5,centerY:angle===0?h*.5:h*.52,angle,turn}),1600000);
function draw(){renderer.reset(p,false);renderer.render({active:true},time,1,p);document.querySelector('#state').textContent=canvas.dataset.headPitch+'°';}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{p=+b.dataset.p;angle=+b.dataset.a;draw()});document.querySelector('#time').oninput=document.querySelector('#time').onchange=e=>{time=+e.target.value;draw()};document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';last=0;if(playing)requestAnimationFrame(tick)};function tick(t){if(!playing)return;if(last)time+=(t-last)/1000;last=t;renderer.render({active:true},time,1,p);requestAnimationFrame(tick)}const sweep=document.createElement('div');sweep.style.cssText='display:flex;gap:3px;width:100%';for(let deg=0;deg<=90;deg+=5){const b=document.createElement('button');b.textContent=deg+'°';b.id='pitch-'+deg;b.onclick=()=>{let lo=.54,hi=.78;for(let i=0;i<32;i++){const m=(lo+hi)/2;if(turnPitch(m,false)<deg*Math.PI/180)lo=m;else hi=m;}p=(lo+hi)/2;angle=270;draw();};sweep.append(b);}document.querySelector('header').append(sweep);addEventListener('resize',()=>{renderer.resize();draw()});draw();
</script>
